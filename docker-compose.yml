# Cross-platform TurtleBot3 Nav Monitor
#
#   Linux / Mac  →  ./scripts/run_compose.sh   (auto-detects OS)
#   Windows      →  .\scripts\run_windows.ps1  (requires VcXsrv)
#
# WORLD required: obstacles | house | narrow
# MODE optional:  slam (default) | amcl

services:

  # ── Gazebo + Nav2 ─────────────────────────────────────────────────────────
  sim:
    image: tbot3_nav_monitor:latest
    build:
      context: .
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - TURTLEBOT3_MODEL=burger
    volumes:
      - ./maps:/ros2_ws/maps:rw
      - /dev/shm:/dev/shm
    networks:
      - ros_net
    ipc: host
    privileged: true
    command: >
      ros2 launch tbot3_nav_monitor
      simulation_${WORLD:?WORLD must be set to obstacles, house, or narrow}.launch.py
      mode:=${MODE:-slam}

  # ── Monitor nodes ──────────────────────────────────────────────────────────
  monitor:
    image: tbot3_nav_monitor:latest
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      - NAV_CONFIG=${NAV_CONFIG:-default}
      - TURTLEBOT3_MODEL=burger
    volumes:
      - ./data:/ros2_ws/data:rw
      - /dev/shm:/dev/shm
    networks:
      - ros_net
    ipc: host
    ports:
      - "8080:8080"
    depends_on:
      - sim
    command: bash -c "
      echo '[monitor] Waiting for Nav2 action server...';
      until ros2 action list 2>/dev/null | grep -q navigate_to_pose; do sleep 3; done;
      echo '[monitor] Nav2 ready — launching monitor nodes';
      ros2 launch tbot3_nav_monitor monitor.launch.py
        world:=${WORLD:?WORLD must be set}
        config:=${NAV_CONFIG:-default}
        adaptive:=${NAV_ADAPTIVE:-$([ \"${NAV_CONFIG:-default}\" = \"baseline\" ] && echo false || echo true)}
        dashboard_port:=${DASHBOARD_PORT:-8080}"

networks:
  ros_net:
    driver: bridge

volumes: {}
